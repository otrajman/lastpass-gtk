name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish release assets on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # fail fast if a package mirror stalls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Build container
        # --pull: latest patched base image; Azure mirror: much faster from GitHub runners
        run: >-
          docker build --pull -t lastpass-gtk-build
          --build-arg UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu/ packaging

      - name: Tests (real lastpass-cli code against its mock server)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src lastpass-gtk-build \
            sh -c 'LPASS_TEST=1 scripts/build-lpass.sh build/lpass-ci && python3 -m unittest -v tests/test_lpass.py'

      - name: Build .deb and AppImage
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src lastpass-gtk-build \
            sh -c 'packaging/deb/build-deb.sh && packaging/appimage/build-appimage.sh'
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: packages
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "LastPass GTK ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/RELEASE_NOTES.md --verify-tag
